# Run two backends in separate terminals:
# ./http_server 9001 public
# ./http_server 9002 public
port = 8080
proxy_prefix = /proxy/
upstream_group = local
upstream_balance = round-robin
upstream_pool_enabled = 1
upstream_health_path = /health

[backend api-a]
address = 127.0.0.1
port = 9001
host = localhost:9001

[backend api-b]
address = 127.0.0.1
port = 9002
host = localhost:9002
