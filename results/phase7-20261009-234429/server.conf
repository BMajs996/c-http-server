# Paths are relative to the working directory. Unknown/duplicate keys fail startup.
bind_address = 127.0.0.1
port = 58215
document_root = /tmp/phase7-benchmark-sgdmefp_/public
max_connections = 1024
shutdown_ms = 5000
request_timeout_ms = 5000
response_timeout_ms = 30000
max_requests = 100
file_workers = 4
file_job_limit = 64
log_queue_limit = 1024
# '-' logs to stderr; '0' disables access logging. Env C_HTTP_ACCESS_LOG overrides.
access_log = 0
# Cache is opt-in. This example enables a 16 MiB cache for small assets.
cache_bytes = 16777216
cache_max_file_bytes = 65536
cache_entries = 256
cache_ttl_ms = 1000
# Leave both blank for HTTP; provide PEM paths to enable HTTPS on this port.
tls_cert =
tls_key =

# Optional credential file outside document_root. Protected routes require credentials.
# auth_credentials_file = .secrets/server.credentials
# auth_timestamp_window_s = 60
# auth_nonce_entries = 4096
