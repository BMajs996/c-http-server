# Backend: ./http_server 9000 public
# Proxy:   ./http_server --config server-pool.conf
bind_address = 127.0.0.1
port = 8080
document_root = public
access_log = -
proxy_prefix = /proxy/
upstream_address = 127.0.0.1
upstream_port = 9000
upstream_host = localhost:9000
upstream_pool_enabled = 1
upstream_pool_max_connections = 64
upstream_pool_idle_limit = 16
upstream_pool_idle_timeout_ms = 15000
upstream_pool_max_age_ms = 300000
upstream_pool_max_requests = 1000
upstream_connect_timeout_ms = 2000
upstream_handshake_timeout_ms = 3000
upstream_write_timeout_ms = 5000
upstream_read_timeout_ms = 5000
upstream_response_timeout_ms = 30000
# For a TLS backend, enable these and set paths/identity before starting:
# upstream_tls = 1
# upstream_tls_server_name = backend.example.test
# upstream_tls_ca_file = /etc/c-http-server/backend-ca.pem
# Optional mTLS, both files together:
# upstream_tls_client_cert = /etc/c-http-server/client-chain.pem
# upstream_tls_client_key = /etc/c-http-server/client.key
