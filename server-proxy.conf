# Start a backend first: python3 -m http.server 9000 --bind 127.0.0.1 --directory public
# Run the proxy: ./http_server --config server-proxy.conf
# Probe: curl http://127.0.0.1:8080/proxy/assets/style.css
bind_address = 127.0.0.1
port = 8080
document_root = public
max_connections = 1024
shutdown_ms = 5000
access_log = -
proxy_prefix = /proxy/
upstream_address = 127.0.0.1
upstream_port = 9000
upstream_host = localhost:9000
upstream_connect_timeout_ms = 2000
upstream_response_timeout_ms = 30000
